[package]
name = "proxpilot"
version = "0.1.0"
edition = "2021"
description = "代理领航员：节点检测、智能优选、自动切换、全时守护（支持 Clash/mihomo 系客户端）"

[dependencies]
ureq = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
colored = "2"
winreg = "0.52"
rusqlite = { version = "0.32", features = ["bundled"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
